services:
  getshoco-site:
    image: nginx:alpine
    container_name: getshoco-site
    restart: unless-stopped
    volumes:
      - /srv/deployed/public-site/public:/usr/share/nginx/html:ro
      - /srv/deployed/public-site/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - joelab-ingress

  mailing-list:
    build:
      context: ./service
    container_name: shoco-mailing-list
    restart: unless-stopped
    environment:
      SHOCO_MAILING_LIST_DB: /data/mailing-list.sqlite3
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - mailing_list_data:/data
    networks:
      - joelab-ingress

networks:
  joelab-ingress:
    external: true

volumes:
  mailing_list_data:
